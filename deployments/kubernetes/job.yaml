apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-scale-validation
  namespace: scale-validation-lab
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-scale-validation-lab
    spec:
      restartPolicy: Never
      containers:
        - name: validator
          image: ghcr.io/your-account/distributed-scale-validation-lab:latest
          imagePullPolicy: IfNotPresent
          args: ["-seed=public-kubernetes-demo", "-count=10000", "-workers=4"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
